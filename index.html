<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock View | Sit Healthier</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #080c14;
      --surface: #0e1520;
      --surface2: #141e2d;
      --surface3: #1a2539;
      --border: #1f2e45;
      --border2: #243354;
      --accent: #00d4ff;
      --accent3: #00ffaa;
      --text: #e8f0fe;
      --text2: #8ba3c7;
      --text3: #4a6285;
      --green: #00e676;
      --yellow: #ffd740;
      --red: #ff5252
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      overflow-x: hidden
    }

    body::before {
      content: '';
      position: fixed;
      top: -200px;
      left: -200px;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(0, 212, 255, .06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: drift1 20s ease-in-out infinite alternate
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -200px;
      right: -200px;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(0, 255, 170, .04) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: drift2 25s ease-in-out infinite alternate
    }

    @keyframes drift1 {
      to {
        transform: translate(100px, 100px)
      }
    }

    @keyframes drift2 {
      to {
        transform: translate(-100px, -80px)
      }
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8, 12, 20, .95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0 32px
    }

    .header-inner {
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 16px;
      height: 64px
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--accent), var(--accent3));
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
      color: #000;
      box-shadow: 0 0 18px rgba(0, 212, 255, .3)
    }

    .logo-text {
      font-size: 17px;
      font-weight: 700;
      background: linear-gradient(90deg, var(--accent), var(--accent3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -.5px
    }

    .search-wrap {
      flex: 1;
      max-width: 480px;
      position: relative
    }

    .search-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text3);
      font-size: 14px;
      pointer-events: none
    }

    #searchInput {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 36px 9px 38px;
      color: var(--text);
      font-family: 'Poppins', sans-serif;
      font-size: 13px;
      outline: none;
      transition: border-color .2s, box-shadow .2s
    }

    #searchInput::placeholder {
      color: var(--text3)
    }

    #searchInput:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 212, 255, .1)
    }

    .search-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text3);
      cursor: pointer;
      font-size: 14px;
      display: none;
      padding: 4px;
      border-radius: 4px
    }

    .search-clear.vis {
      display: flex;
      align-items: center
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
      flex-shrink: 0
    }

    .stat-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 11px;
      white-space: nowrap
    }

    .stat-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent3);
      animation: pulse 2s ease-in-out infinite
    }

    .stat-dot.offline {
      background: var(--red)
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1)
      }

      50% {
        opacity: .6;
        transform: scale(.8)
      }
    }

    .hdr-btn {
      height: 32px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text2);
      cursor: pointer;
      font-size: 11px;
      font-family: 'Poppins', sans-serif;
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all .2s;
      white-space: nowrap
    }

    .hdr-btn:hover {
      border-color: var(--accent);
      color: var(--accent)
    }

    .hdr-btn.connected {
      border-color: var(--green);
      color: var(--green)
    }

    .refresh-btn {
      width: 32px;
      height: 32px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text2);
      cursor: pointer;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .2s
    }

    .refresh-btn:hover {
      border-color: var(--accent);
      color: var(--accent)
    }

    .refresh-btn.spinning .spin-icon {
      animation: spin .8s linear infinite
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    #apiPanel {
      display: none;
      position: absolute;
      top: 64px;
      right: 32px;
      z-index: 200;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 14px;
      padding: 16px 18px;
      width: 460px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, .5)
    }

    .filter-bar {
      max-width: 1600px;
      margin: 0 auto;
      padding: 12px 32px;
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border)
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap
    }

    .filter-sep {
      width: 1px;
      height: 20px;
      background: var(--border2);
      flex-shrink: 0
    }

    .filter-lbl {
      font-size: 10px;
      color: var(--text3);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .8px;
      white-space: nowrap
    }

    .chip {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text2);
      transition: all .2s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 5px
    }

    .chip:hover {
      border-color: var(--accent);
      color: var(--accent)
    }

    .chip.active {
      background: rgba(0, 212, 255, .1);
      border-color: var(--accent);
      color: var(--accent)
    }

    .results-info {
      margin-left: auto;
      font-size: 11px;
      color: var(--text3);
      display: flex;
      align-items: center;
      gap: 12px
    }

    .results-info b {
      color: var(--accent);
      font-weight: 600
    }

    .view-toggle {
      display: flex;
      gap: 4px
    }

    .view-btn {
      width: 28px;
      height: 28px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      transition: all .2s
    }

    .view-btn.active {
      background: rgba(0, 212, 255, .1);
      border-color: var(--accent);
      color: var(--accent)
    }

    .grid-section {
      max-width: 1600px;
      margin: 0 auto;
      padding: 20px 32px 60px;
      position: relative;
      z-index: 1
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 18px
    }

    .product-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: transform .25s, border-color .25s, box-shadow .25s;
      animation: cardIn .4s ease both;
      position: relative
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(16px) scale(.97)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .product-card:hover {
      transform: translateY(-3px);
      border-color: var(--border2);
      box-shadow: 0 10px 36px rgba(0, 0, 0, .4), 0 0 0 1px rgba(0, 212, 255, .08)
    }

    .product-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0;
      transition: opacity .3s
    }

    .product-card:hover::before {
      opacity: 1
    }

    .card-header {
      padding: 14px 14px 8px;
      display: flex;
      align-items: flex-start;
      gap: 10px
    }

    .card-image {
      width: 56px;
      height: 56px;
      border-radius: 9px;
      background: var(--surface2);
      border: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      overflow: hidden
    }

    .card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .card-info {
      flex: 1;
      min-width: 0
    }

    .card-sku {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: .5px;
      text-transform: uppercase;
      margin-bottom: 2px
    }

    .card-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 4px
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap
    }

    .color-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      color: var(--text2)
    }

    .model-badge {
      font-size: 9px;
      padding: 2px 7px;
      background: rgba(255, 255, 255, .05);
      border-radius: 20px;
      color: var(--text3);
      border: 1px solid var(--border)
    }

    .card-body {
      padding: 0 14px 14px
    }

    .stock-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface2);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 8px;
      border: 1px solid var(--border)
    }

    .stock-label {
      font-size: 9px;
      color: var(--text3);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .5px
    }

    .stock-bar-wrap {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 4px;
      width: 70px
    }

    .stock-bar {
      height: 100%;
      border-radius: 2px;
      transition: width .8s ease
    }

    .stock-value {
      font-size: 20px;
      font-weight: 800;
      line-height: 1
    }

    .sh {
      color: var(--green)
    }

    .sm {
      color: var(--yellow)
    }

    .sl {
      color: var(--red)
    }

    .sz {
      color: var(--text3)
    }

    .deliveries-preview {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-bottom: 6px
    }

    .delivery-chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 4px 7px;
      min-width: 50px
    }

    .delivery-month {
      font-size: 8px;
      color: var(--text3);
      font-weight: 600;
      text-transform: uppercase
    }

    .delivery-qty {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent3);
      margin-top: 1px
    }

    .no-delivery {
      font-size: 10px;
      color: var(--text3);
      font-style: italic
    }

    .card-note {
      margin-top: 6px;
      padding: 6px 8px;
      background: rgba(255, 215, 64, .05);
      border: 1px solid rgba(255, 215, 64, .15);
      border-radius: 6px;
      font-size: 10px;
      color: var(--text2);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden
    }

    .table-section {
      max-width: 1600px;
      margin: 0 auto;
      padding: 20px 32px 60px;
      position: relative;
      z-index: 1;
      display: none
    }

    .table-wrap {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid var(--border)
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px
    }

    thead th {
      background: var(--surface2);
      color: var(--text3);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .8px;
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      transition: color .2s
    }

    thead th:hover {
      color: var(--accent)
    }

    thead th.sorted {
      color: var(--accent)
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background .15s;
      cursor: pointer;
      animation: rowIn .3s ease both
    }

    @keyframes rowIn {
      from {
        opacity: 0;
        transform: translateX(-6px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    tbody tr:hover {
      background: var(--surface2)
    }

    tbody tr:last-child {
      border-bottom: none
    }

    td {
      padding: 10px 14px;
      color: var(--text2);
      vertical-align: middle
    }

    td.sku-cell {
      color: var(--accent);
      font-weight: 700;
      font-size: 11px;
      letter-spacing: .3px;
      white-space: nowrap
    }

    td.name-cell .pname {
      color: var(--text);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
      max-width: 220px
    }

    td.stock-cell {
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap
    }

    .tbl-color {
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap
    }

    .tbl-deliveries {
      display: flex;
      gap: 4px;
      flex-wrap: nowrap
    }

    .tbl-del-chip {
      background: var(--surface3);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 2px 6px;
      font-size: 9px;
      color: var(--accent3);
      white-space: nowrap
    }

    .tbl-note {
      max-width: 160px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 11px;
      color: var(--yellow);
      opacity: .8
    }

    .view-detail-btn {
      padding: 4px 10px;
      background: rgba(0, 212, 255, .08);
      border: 1px solid rgba(0, 212, 255, .2);
      border-radius: 6px;
      color: var(--accent);
      font-size: 10px;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      transition: all .2s;
      white-space: nowrap
    }

    .view-detail-btn:hover {
      background: rgba(0, 212, 255, .15)
    }

    .empty-state {
      grid-column: 1/-1;
      text-align: center;
      padding: 80px 32px;
      color: var(--text3)
    }

    .empty-icon {
      font-size: 44px;
      margin-bottom: 14px
    }

    .empty-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text2);
      margin-bottom: 6px
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .7);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: all
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 18px;
      width: 100%;
      max-width: 700px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .6);
      transform: scale(.93) translateY(20px);
      transition: transform .35s cubic-bezier(.34, 1.56, .64, 1), opacity .3s;
      opacity: 0;
      scrollbar-width: thin;
      scrollbar-color: var(--border2) transparent
    }

    .modal-overlay.open .modal {
      transform: scale(1) translateY(0);
      opacity: 1
    }

    .modal-header {
      padding: 22px 22px 14px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--surface);
      z-index: 10;
      border-radius: 18px 18px 0 0
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 30px;
      height: 30px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text2);
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .2s
    }

    .modal-close:hover {
      border-color: var(--accent);
      color: var(--accent)
    }

    .modal-sku {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 5px
    }

    .modal-name {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.3;
      padding-right: 36px;
      margin-bottom: 8px
    }

    .modal-tags {
      display: flex;
      gap: 7px;
      flex-wrap: wrap
    }

    .tag {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 600;
      border: 1px solid;
      display: inline-flex;
      align-items: center;
      gap: 4px
    }

    .tag-model {
      background: rgba(0, 212, 255, .08);
      border-color: rgba(0, 212, 255, .3);
      color: var(--accent)
    }

    .tag-color {
      background: rgba(255, 255, 255, .05);
      border-color: var(--border2);
      color: var(--text2)
    }

    .tag-mfr {
      background: rgba(0, 255, 170, .06);
      border-color: rgba(0, 255, 170, .25);
      color: var(--accent3)
    }

    .modal-body {
      padding: 18px 22px 22px
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px
    }

    .info-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px
    }

    .info-card-label {
      font-size: 9px;
      color: var(--text3);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .8px;
      margin-bottom: 5px
    }

    .info-card-value {
      font-size: 22px;
      font-weight: 800;
      line-height: 1
    }

    .info-card-sub {
      font-size: 10px;
      color: var(--text3);
      margin-top: 3px
    }

    .section-title {
      font-size: 10px;
      font-weight: 700;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 7px
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border)
    }

    .deliveries-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
      gap: 8px;
      margin-bottom: 18px
    }

    .delivery-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 9px 10px;
      text-align: center;
      transition: border-color .2s, transform .2s
    }

    .delivery-card:hover {
      border-color: var(--accent3);
      transform: translateY(-2px)
    }

    .delivery-card-month {
      font-size: 9px;
      color: var(--text3);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 3px
    }

    .delivery-card-qty {
      font-size: 16px;
      font-weight: 800;
      color: var(--accent3)
    }

    .details-list {
      display: flex;
      flex-direction: column;
      margin-bottom: 18px
    }

    .detail-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border)
    }

    .detail-row:last-child {
      border-bottom: none
    }

    .detail-key {
      font-size: 10px;
      color: var(--text3);
      font-weight: 600;
      min-width: 100px;
      flex-shrink: 0;
      padding-top: 1px
    }

    .detail-val {
      font-size: 11px;
      color: var(--text2);
      word-break: break-all;
      flex: 1
    }

    .detail-val a {
      color: var(--accent);
      text-decoration: none
    }

    .detail-val a:hover {
      text-decoration: underline
    }

    .note-editor {
      margin-bottom: 18px
    }

    .note-textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 10px 12px;
      color: var(--text);
      font-family: 'Poppins', sans-serif;
      font-size: 12px;
      line-height: 1.6;
      resize: vertical;
      min-height: 80px;
      outline: none;
      transition: border-color .2s
    }

    .note-textarea:focus {
      border-color: var(--accent)
    }

    .note-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px
    }

    .btn-save-note {
      padding: 6px 16px;
      background: var(--accent);
      border: none;
      border-radius: 7px;
      color: #000;
      font-family: 'Poppins', sans-serif;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s
    }

    .btn-save-note:hover {
      opacity: .85
    }

    .btn-save-note:disabled {
      opacity: .4;
      cursor: not-allowed
    }

    .note-status {
      font-size: 10px;
      color: var(--text3)
    }

    .note-status.ok {
      color: var(--green)
    }

    .note-status.err {
      color: var(--red)
    }

    .toast {
      position: fixed;
      bottom: 22px;
      right: 22px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 12px;
      color: var(--text);
      box-shadow: 0 8px 32px rgba(0, 0, 0, .4);
      z-index: 2000;
      transform: translateY(100px);
      opacity: 0;
      transition: all .35s cubic-bezier(.34, 1.56, .64, 1);
      display: flex;
      align-items: center;
      gap: 8px
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1
    }

    @media(max-width:768px) {
      header {
        padding: 0 14px
      }

      .filter-bar,
      .grid-section,
      .table-section {
        padding-left: 14px;
        padding-right: 14px
      }

      .products-grid {
        grid-template-columns: 1fr
      }

      .info-grid {
        grid-template-columns: 1fr
      }

      .modal {
        border-radius: 14px
      }

      .logo-text {
        display: none
      }

      #apiPanel {
        width: calc(100vw - 28px);
        right: 14px
      }

      .header-right .stat-pill {
        display: none
      }
    }
  </style>
</head>

    function setApiStatus(s, t) { const d = document.getElementById('apiDot'), tx = document.getElementById('apiStatusText'); const c = { connected: 'var(--green)', loading: 'var(--yellow)', disconnected: 'var(--red)' }; if (d) d.style.background = c[s] || 'var(--text3)'; if (tx) tx.textContent = t; }

    function fetchJSONP(url, opts) { opts = opts || {}; return new Promise((res, rej) => { const cb = '__sv_' + Date.now(), s = document.createElement('script'), t = setTimeout(() => { cleanup(); rej(new Error('Timeout')); }, 20000); function cleanup() { clearTimeout(t); delete window[cb]; s.parentNode && s.parentNode.removeChild(s); } window[cb] = d => { cleanup(); res(d); }; s.onerror = () => { cleanup(); rej(new Error('Script load failed')); }; const clean = url.replace(/[?&]callback=[^&]*/g, '').replace(/[?&]_t=[^&]*/g, ''), sep = clean.includes('?') ? '&' : '?'; s.src = clean + sep + 'callback=' + cb + (opts.noCache ? '&nocache=1' : '') + '&_t=' + Date.now(); document.head.appendChild(s); }); }

      if (apiUrl) { try { const d = await fetchJSONP(apiUrl, { noCache: force }); if (d.error) throw new Error(d.error); PRODUCTS = d.products || []; INVENTORY = d.inventory || {}; setApiStatus('connected', 'Live — Google Sheets'); const cb = document.getElementById('apiConnectBtn'); if (cb) { cb.textContent = '✅ Live'; cb.classList.add('connected'); } document.getElementById('statDot').classList.remove('offline'); showToast('✅ ' + PRODUCTS.length + ' products loaded'); startAutoRefresh(); } catch (e) { console.error(e); setApiStatus('disconnected', 'Connection failed'); document.getElementById('statDot').classList.add('offline'); showToast('⚠️ API error — offline data'); useFallback(); } }

    function useFallback() { PRODUCTS = FALLBACK_PRODUCTS; INVENTORY = FALLBACK_INVENTORY; PRODUCTS.forEach(p => { if (INVENTORY[p.sku] !== undefined) p.inventoryStock = INVENTORY[p.sku]; }); }
    function startAutoRefresh() { clearInterval(autoRefreshTimer); autoRefreshTimer = setInterval(() => loadData(false), 10000); }

    async function saveNote(sku, note, btnEl, statusEl) {
      if (!apiUrl) { statusEl.textContent = '❌ API not connected'; statusEl.className = 'note-status err'; return; }

        else throw new Error(d.error || 'Unknown error');

    }

    function buildFilters() {
      const mc = document.getElementById('modelChips');
      mc.innerHTML = '<span class="filter-lbl">Model</span>';
      const allM = document.createElement('div'); allM.className = 'chip' + (activeModel === 'all' ? ' active' : ''); allM.textContent = 'All'; allM.onclick = () => setModel('all', allM); mc.appendChild(allM);
      const models = [...new Set(PRODUCTS.map(p => p.model).filter(m => m && m !== 'nan' && m !== ''))].sort();
      models.forEach(m => { const d = document.createElement('div'); d.className = 'chip' + (activeModel === m ? ' active' : ''); d.textContent = 'Model ' + m; d.onclick = () => setModel(m, d); mc.appendChild(d); });
      updateColorChips();
    }

    function updateColorChips() {
      const cc = document.getElementById('colorChips'), sep = document.getElementById('colorSep');
      const prods = activeModel === 'all' ? PRODUCTS : PRODUCTS.filter(p => p.model === activeModel);
      const colors = [...new Set(prods.map(p => p.color).filter(c => c && c !== ''))].sort();
      if (!colors.length) { cc.style.display = 'none'; sep.style.display = 'none'; return; }
      cc.style.display = 'flex'; sep.style.display = 'block';
      cc.innerHTML = '<span class="filter-lbl">Color</span>';
      const allC = document.createElement('div'); allC.className = 'chip' + (activeColor === 'all' ? ' active' : ''); allC.textContent = 'All'; allC.onclick = () => setColor('all', allC); cc.appendChild(allC);
      colors.forEach(c => { const d = document.createElement('div'); d.className = 'chip' + (activeColor === c ? ' active' : ''); d.innerHTML = cDot(c, 8) + ' ' + c; d.onclick = () => setColor(c, d); cc.appendChild(d); });
    }

    function setModel(v, el) { activeModel = v; activeColor = 'all'; document.querySelectorAll('#modelChips .chip').forEach(c => c.classList.remove('active')); el.classList.add('active'); updateColorChips(); render(); }
    function setColor(v, el) { activeColor = v; document.querySelectorAll('#colorChips .chip').forEach(c => c.classList.remove('active')); el.classList.add('active'); render(); }
    function setStock(v, el) { activeStock = v; document.querySelectorAll('#stockChips .chip').forEach(c => c.classList.remove('active')); el.classList.add('active'); render(); }

    document.getElementById('searchInput').addEventListener('input', function () { searchQuery = this.value.trim().toLowerCase(); document.getElementById('searchClear').classList.toggle('vis', !!searchQuery); render(); });
    function clearSearch() { document.getElementById('searchInput').value = ''; searchQuery = ''; document.getElementById('searchClear').classList.remove('vis'); render(); }

    function filtered() {
      let prods = PRODUCTS.filter(p => {
        if (!p.sku || p.sku.toUpperCase().includes('LEGEND') || p.sku.length > 60) return false;
        if (activeModel !== 'all' && p.model !== activeModel) return false;
        if (activeColor !== 'all' && (p.color || '').toLowerCase() !== activeColor.toLowerCase()) return false;
        if (activeStock === 'in' && p.stockInHand <= 0) return false;
        if (activeStock === 'out' && p.stockInHand > 0) return false;
        if (searchQuery) { const hay = [p.sku, p.productName, p.color, p.model, p.manufacturer, p.notes, p.owdId].join(' ').toLowerCase(); if (!hay.includes(searchQuery)) return false; }
        return true;
      });
      if (sortCol) { prods = [...prods].sort((a, b) => { const av = a[sortCol] ?? '', bv = b[sortCol] ?? ''; if (typeof av === 'number') return (av - bv) * sortDir; return String(av).localeCompare(String(bv)) * sortDir; }); }
      return prods;
    }

    function setView(v) { currentView = v; document.getElementById('gridSection').style.display = v === 'grid' ? 'block' : 'none'; document.getElementById('tableSection').style.display = v === 'table' ? 'block' : 'none'; document.getElementById('gridViewBtn').classList.toggle('active', v === 'grid'); document.getElementById('tableViewBtn').classList.toggle('active', v === 'table'); render(); }

    function sortTable(col) { if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = 1; } document.querySelectorAll('thead th').forEach(th => th.classList.remove('sorted')); const cols = ['sku', 'productName', 'color', 'model', 'stockInHand', 'inventoryStock', 'deliveries', 'notes', '']; const idx = cols.indexOf(col); if (idx >= 0 && document.querySelectorAll('thead th')[idx]) document.querySelectorAll('thead th')[idx].classList.add('sorted'); render(); }

    function render() { const prods = filtered(); document.getElementById('visibleCount').textContent = prods.length; document.getElementById('totalCount').textContent = PRODUCTS.length; if (currentView === 'grid') renderGrid(prods); else renderTable(prods); }

    function renderGrid(prods) {
      const grid = document.getElementById('productsGrid'); grid.innerHTML = '';
      if (!prods.length) { grid.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">No products found</div><p>Try a different filter</p></div>'; return; }
      prods.forEach((p, i) => {
        const card = document.createElement('div'); card.className = 'product-card'; card.style.animationDelay = Math.min(i * .04, .5) + 's';
        const st = p.stockInHand, bp = Math.min(100, (st / 200) * 100);
        const dk = Object.keys(p.deliveries || {}).slice(0, 3);

        const dh = dk.length ? dk.map(k => `<div class="delivery-chip"><span class="delivery-month">${k}</span><span class="delivery-qty">${p.deliveries[k]}</span></div>`).join('') : '<span class="no-delivery">No upcoming deliveries</span>';
        const nh = p.notes ? `<div class="card-note">📝 ${p.notes}</div>` : '';
        const ih = p.imageUrl ? `<img src="${p.imageUrl}" alt="${p.sku}" onerror="this.parentNode.innerHTML='🪑'">` : '🪑';
        card.innerHTML = `<div class="card-header"><div class="card-image">${ih}</div><div class="card-info"><div class="card-sku">${p.sku}</div><div class="card-name">${p.productName || 'Product ' + p.sku}</div><div class="card-meta">${p.color ? `<div class="color-badge">${cDot(p.color)}<span style="margin-left:3px">${p.color}</span></div>` : ''} ${p.model && p.model !== 'nan' ? `<div class="model-badge">Model ${p.model}</div>` : ''}</div></div></div><div class="card-body"><div class="stock-row"><div><div class="stock-label">Stock In Hand</div><div class="stock-bar-wrap"><div class="stock-bar" style="width:${bp}%;background:${sColor(st)}"></div></div></div><div class="stock-value ${sCls(st)}">${st}</div></div><div class="deliveries-preview">${dh}</div>${nh}</div>`;
        card.onclick = () => openModal(p); grid.appendChild(card);
      });
    }

    function renderTable(prods) {
      const tb = document.getElementById('tableBody'); tb.innerHTML = '';
      if (!prods.length) { tb.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:60px;color:var(--text3)">No products found</td></tr>'; return; }
      prods.forEach((p, i) => {
        const tr = document.createElement('tr'); tr.style.animationDelay = Math.min(i * .02, .3) + 's';
        const st = p.stockInHand, inv = p.inventoryStock ?? st;
        const dk = Object.keys(p.deliveries || {}).slice(0, 2);
        const dh = dk.map(k => `<span class="tbl-del-chip">${k}: ${p.deliveries[k]}</span>`).join('');
        const sku_safe = p.sku.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        tr.innerHTML = `<td class="sku-cell">${p.sku}</td><td class="name-cell"><span class="pname">${p.productName || '—'}</span></td><td><div class="tbl-color">${cDot(p.color || '')} ${p.color || '—'}</div></td><td style="color:var(--text2);font-weight:600">${p.model && p.model !== 'nan' ? p.model : '—'}</td><td class="stock-cell ${sCls(st)}">${st}</td><td><div class="tbl-deliveries">${dh || '<span style="color:var(--text3);font-size:10px">—</span>'}</div></td><td><span class="tbl-note" title="${p.notes || ''}">${p.notes || '—'}</span></td><td><button class="view-detail-btn" onclick="event.stopPropagation();openModalBySku('${sku_safe}')">View Details</button></td>`;
        tr.onclick = () => openModal(p); tb.appendChild(tr);
      });
    }

    function openModalBySku(sku) { const p = PRODUCTS.find(x => x.sku === sku); if (p) openModal(p); }

    function openModal(p) {
      if (!p) return;
      document.getElementById('mSku').textContent = p.sku;
      document.getElementById('mName').textContent = p.productName || 'Product ' + p.sku;
      const te = document.getElementById('mTags'); te.innerHTML = '';
      if (p.model && p.model !== 'nan') te.innerHTML += `<span class="tag tag-model">Model ${p.model}</span>`;
      if (p.color) te.innerHTML += `<span class="tag tag-color">${cDot(p.color)} ${p.color}</span>`;
      if (p.manufacturer) te.innerHTML += `<span class="tag tag-mfr">${p.manufacturer}</span>`;
      const st = p.stockInHand, inv = p.inventoryStock ?? st, de = Object.entries(p.deliveries || {});
      const nid = 'nt_' + Date.now(), bid = 'nb_' + Date.now(), sid = 'ns_' + Date.now();
      let body = `<div class="info-grid"><div class="info-card"><div class="info-card-label">Stock In Hand</div><div class="info-card-value ${sCls(st)}">${st}</div><div class="info-card-sub">Units available</div></div><div class="info-card"><div class="info-card-label">Inventory On Hand</div><div class="info-card-value ${sCls(inv)}">${inv}</div><div class="info-card-sub">From inventory sheet</div></div></div>`;
      if (de.length) body += `<div class="section-title">Scheduled Deliveries</div><div class="deliveries-grid">${de.map(([m, q], i) => `<div class="delivery-card" style="animation-delay:${i * .05}s"><div class="delivery-card-month">${m}</div><div class="delivery-card-qty">${q}</div></div>`).join('')}</div>`;
      const dets = [['OWD ID', p.owdId || '—'], ['Sheet', p.sheetName || '—'], ['Source File', p.sourceFile || '—'], ['Product URL', p.productUrl ? `<a href="${p.productUrl}" target="_blank">View Product ↗</a>` : '—'], ['Upcoming', p.upcoming || '—']];
      body += `<div class="section-title">Details</div><div class="details-list">${dets.map(([k, v]) => `<div class="detail-row"><span class="detail-key">${k}</span><span class="detail-val">${v}</span></div>`).join('')}</div>`;
      const sku_js = p.sku.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
      body += `<div class="section-title">Notes</div><div class="note-editor"><textarea class="note-textarea" id="${nid}" placeholder="Add or edit note…">${(p.notes || '').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</textarea><div class="note-actions"><button class="btn-save-note" id="${bid}" onclick="saveNote('${sku_js}',document.getElementById('${nid}').value,document.getElementById('${bid}'),document.getElementById('${sid}'))">💾 Save to Sheet</button><span class="note-status" id="${sid}">${apiUrl ? '' : 'Connect API to enable saving'}</span></div></div>`;
      document.getElementById('modalBody').innerHTML = body;
      document.getElementById('modalOverlay').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); document.body.style.overflow = ''; }
    function closeModalOnBg(e) { if (e.target === document.getElementById('modalOverlay')) closeModal(); }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    let toastTimer;
    function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3500); }
    setView('table');
    loadData(true);
  </script>
</body>

</html>
